language: Telugu
data:
  hf_name: SPRINGLab/IndicTTS_Telugu
  hf_split: train
  speaker_column: gender
  text_column: null
  local_dir: ''
  reject_regex: ''
  min_dur: 1.5
  max_dur: 12.0
  min_words: 2
  max_words: 40
  train_hours: 5.0
  val_hours: 1.0
  per_speaker_budget: true
  seed: 1234
  mfa:
    mode: scratch
    acoustic_model: english_us_arpa
    jobs: 4
preprocess:
  dataset: Telugu
  path:
    raw_path: ./raw_data
    preprocessed_path: ./preprocessed_data
    split_path: ./split
    dict_path: ./mfa/dictionary.dict
    lexicon_path: lexicon/librispeech-lexicon.txt
  preprocessing:
    val_size: 0
    max_frames: 1500
    text:
      text_cleaners:
      - basic_cleaners
      language: te
    audio:
      sampling_rate: 22050
      max_wav_value: 32768.0
    stft:
      filter_length: 1024
      hop_length: 256
      win_length: 1024
    mel:
      n_mel_channels: 80
      mel_fmin: 0
      mel_fmax: 8000
    pitch:
      feature: phoneme_level
      normalization: true
    energy:
      feature: phoneme_level
      normalization: true
model:
  transformer:
    encoder_layer: 4
    encoder_head: 2
    encoder_hidden: 256
    decoder_layer: 6
    decoder_head: 2
    decoder_hidden: 256
    conv_filter_size: 1024
    conv_kernel_size:
    - 9
    - 1
    encoder_dropout: 0.2
    decoder_dropout: 0.2
  variance_predictor:
    filter_size: 256
    kernel_size: 3
    dropout: 0.5
  variance_embedding:
    pitch_quantization: linear
    energy_quantization: linear
    n_bins: 256
  multi_speaker: true
  max_seq_len: 1500
  vocoder:
    model: HiFi-GAN
    speaker: universal
train:
  seed: 1234
  path:
    ckpt_path: ./checkpoints
    log_path: ./logs
    result_path: ./results_tmp
  optimizer:
    batch_size: 16
    betas:
    - 0.9
    - 0.98
    eps: 1.0e-09
    weight_decay: 0.0
    grad_clip_thresh: 1.0
    grad_acc_step: 1
    warm_up_step: 4000
    anneal_steps:
    - 19500
    - 25500
    anneal_rate: 0.3
  step:
    total_step: 30000
    log_step: 100
    synth_step: 1000000000
    val_step: 1000
    save_step: 2000
